name: Publicar release Windows
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          New-Item -ItemType Directory -Path data/build-cache -Force | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip -OutFile data/build-cache/python-3.13.17-embed-amd64.zip
      - name: Gerar ZIP e instalador
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          python -c "import os; from pathlib import Path; assert os.environ['RELEASE_TAG'] == 'v' + Path('VERSION').read_text().strip()"
          python build_windows.py
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $assets = Get-ChildItem "releases/$version" -File | ForEach-Object { $_.FullName }
          $flags = @()
          if ($env:RELEASE_TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes @flags
